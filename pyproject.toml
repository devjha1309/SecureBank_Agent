[project]
name = "securebank-agent"
version = "0.2.0"
requires-python = ">=3.12"
description = "Synthetic banking assistant with authenticated MCP tools"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["venv", "migrations"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["venv", "migrations"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
